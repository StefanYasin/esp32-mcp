[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents control of ESP32 hardware over HTTP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stefan Yasin" }]
keywords = ["mcp", "esp32", "arduino", "iot", "relay", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
esp32-mcp = "esp32_mcp.server:main"

[project.urls]
Homepage = "https://github.com/StefanYasin/esp32-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
